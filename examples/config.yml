- id: personal-agent
  disabled: false
  config:
    stateDir: /absolute/path/to/private/state
    bots:
      - id: assistant-a
        connect: true
        appId: YOUR_APP_ID_A
        secretEnv: QQ_ASSISTANT_A_SECRET
        personaFile: /absolute/path/to/private/persona-a.md
        repository: owner/workspace-repository
        allowedUsers: []
        allowedGroups: []
        stickers:
          queries: [开心 表情包, 晚安 表情包]
          sources: []
          referenceImages:
            - /absolute/path/to/private/reference-a-front.png
            - /absolute/path/to/private/reference-a-full-body.png
          identityDescription: 描述角色的发型、服装和标志性配件
      - id: assistant-b
        connect: true
        appId: YOUR_APP_ID_B
        secretEnv: QQ_ASSISTANT_B_SECRET
        personaFile: /absolute/path/to/private/persona-b.md
        repository: owner/workspace-repository
        allowedUsers: []
        allowedGroups: []
        stickers:
          queries: [游戏 吐槽 表情包]
          sources: []
          referenceImages:
            - /absolute/path/to/private/reference-b-front.png
            - /absolute/path/to/private/reference-b-full-body.png
          identityDescription: 描述角色的发型、服装和标志性配件
